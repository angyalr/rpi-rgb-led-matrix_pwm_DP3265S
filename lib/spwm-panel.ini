# SPWM panel runtime settings override
# Helyezd ezt a fájlt a program mellé (vagy /etc/spwm-panel.ini)
# Csak a megadott értékek írják felül a beégetett alapértékeket.
# Megjegyzések: # vagy ; karakterrel kezdődő sorok

[dp3265s]
# Verbose settings dump: 0 = silent, 1 = print parsed settings at startup.
debug = 0

# Chip lánc hossza soronként (4 = 64 oszlop, 8 = 128 csatorna)
upload_chip_count = 8

# OE/ROW jel paraméterek
first_oe_clk_length = 12
oe_clk_length = 4
oe_clk_look_behind = 16
oe_during_upload_clk_count = 0
oe_after_upload_clk_count = 128
end_of_frame_extra_row_cycles = 64

# PWM timing
frame_end_sleep_us = 0

# OE stílus: fm6373, fm6363, dp3265s
oe_style = dp3265s
